<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · AWS VPN</title>
  {{template "style"}}
</head>
<body>
<main>
  <header class="page-head"><div><h1>AWS VPN</h1></div></header>
  <div class="alert alert-destructive" role="alert">
    {{icon "triangle-alert"}}
    <h2 class="alert-title">{{.Title}}</h2>
    <p class="alert-description">{{.Message}}</p>
  </div>
  <div><a class="btn btn-outline" href="/" autofocus>Back to the dashboard</a></div>
</main>
</body>
</html>
