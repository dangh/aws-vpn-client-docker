name: aws-vpn-client

services:
  vpn:
    image: aws-vpn-client
    build:
      context: .
      dockerfile: Dockerfile
    restart: no
    configs:
      - source: vpn_profile
        target: /etc/openvpn/profile.ovpn
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    environment:
      # persist an uploaded profile so the web UI's Reconnect button works
      SAVE_PROFILE: "true"
    ports:
      - "35001:35001"
      - "8888:8888"
    volumes:
      # persists a profile saved via the web UI so "Reconnect" survives recreation
      - vpn_data:/data

  proxy:
    image: kalaksi/tinyproxy
    network_mode: "service:vpn"
    environment:
      TINYPROXY_PORT: "8888"
      TINYPROXY_ALLOW: "0.0.0.0/0"
    depends_on:
      - vpn

configs:
  vpn_profile:
    file: ./profile.ovpn

volumes:
  vpn_data:
