name: aws-vpn-client

services:
  vpn:
    image: ghcr.io/dangh/aws-vpn-client:master
    restart: no
    configs:
      # sample route-up hook (see the route_up config at the bottom). Keeps LAN
      # clients able to reach the proxy after the VPN takes the default route.
      # mode 0555 so openvpn can execute it. Remove this to disable.
      - source: route_up
        target: /etc/openvpn/route-up.sh
        mode: 0555
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    environment:
      # persist an uploaded profile so the web UI's Reconnect button works
      SAVE_PROFILE: "true"
      # after a dropped session, re-authenticate automatically on the next web UI visit
      AUTO_RECONNECT: "true"
      LAN_SUBNET: "${LAN_SUBNET:-}"
    ports:
      - "35001:35001"
      - "${PROXY_PORT:-8888}:${PROXY_PORT:-8888}"
    volumes:
      # persists a profile saved via the web UI so "Reconnect" survives recreation
      - vpn_data:/data

  proxy:
    image: kalaksi/tinyproxy
    network_mode: "service:vpn"
    environment:
      TINYPROXY_PORT: "${PROXY_PORT:-8888}"
      TINYPROXY_ALLOW: "0.0.0.0/0"
    depends_on:
      - vpn

configs:
  # sample deployment-only route-up hook, inlined so nothing is baked into the
  # image. Pins each subnet in $LAN_SUBNET back to the LAN gateway (skipping the
  # VPN) so LAN clients can still reach the proxy; the proxy's own upstream fetch
  # still egresses through the VPN. No-op when LAN_SUBNET is unset.
  route_up:
    content: |
      #!/bin/sh
      if [ -n "$$LAN_SUBNET" ]; then
        DEF="$$(ip route show default | awk '$$5 !~ /^tun/ {print; exit}')"
        GW="$$(echo "$$DEF" | awk '{print $$3}')"
        DEV="$$(echo "$$DEF" | awk '{print $$5}')"
        if [ -n "$$GW" ] && [ -n "$$DEV" ]; then
          for net in $$LAN_SUBNET; do
            ip route add "$$net" via "$$GW" dev "$$DEV" || true
            echo "Added LAN route $$net via $$GW dev $$DEV"
          done
        fi
      fi

volumes:
  vpn_data:
